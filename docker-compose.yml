services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: simlight
      POSTGRES_PASSWORD: simlight
      POSTGRES_DB: simlight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: change-me-in-production
      APP_URL: http://localhost:3001
    volumes:
      - simlight-data:/app/server/data

volumes:
  pgdata:
  simlight-data:
